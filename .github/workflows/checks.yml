name: Checks

# מריץ את בדיקות הבטיחות, בדיקת התוכן והבנייה על כל PR ל-main,
# כדי שכשל ייראה ב-PR לפני המיזוג ולא רק בזמן הדיפלוי.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Business-safety tests
        run: npm test

      - name: Content validation
        run: npm run validate

      - name: Build
        run: npm run build
